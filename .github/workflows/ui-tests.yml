name: ui-tests

# The Android and desktop UI tests (markers `android` and `desktop`), which ci.yml leaves out: started by hand from
# the Actions tab, e.g. before a version bump. Both drive the real app, so each run takes a while (see DEVELOPMENT.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which tests to run
        type: choice
        options: [both, android, desktop]
        default: both

jobs:
  android:
    if: inputs.target != 'desktop'
    runs-on: ubuntu-latest  # the Linux runners have KVM, which the emulator needs
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"  # pinned: an unpinned uv asks the GitHub API, rate-limited on shared runners
          python-version: "3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --locked
      - name: Driven APK (rendered tests)
        run: uv run python scripts/build_driven.py apk
      - name: x86_64 APK (platform tests)
        # flet's debug key: the upload key never leaves the maintainer's machine, and the emulator doesn't care
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          uv run flet build apk --arch x86_64 --build-version "$version" --yes
          apks=(build/apk/*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "expected 1 APK in build/apk, found ${#apks[@]}"; exit 1; }
          mkdir -p dist && cp "${apks[0]}" "dist/timtapper-$version-x86_64.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # the AVD the tests boot locally (scripts/android_phone.py): Pixel 7, API 34, x86_64
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_7
          avd-name: generic_phone_api34
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          script: uv run pytest -m android -v --basetemp=test-output
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-output
          path: test-output/
          if-no-files-found: ignore

  desktop:
    if: inputs.target != 'android'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: "3.14"
      - name: Screen tall enough for the app window
        # the runner's desktop starts at 1024 x 768, shorter than the 892 dp window
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: uv sync --locked
      - name: Tests in a Windows window
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -m desktop -v --basetemp=test-output
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-output
          path: test-output/
          if-no-files-found: ignore

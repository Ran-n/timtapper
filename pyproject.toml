[project]
name = "timtapper"
version = "1.5.0"
description = "Local-first One Piece TCG match tracker (Flet, Android + desktop) with shareable stat images."
readme = "README.md"
authors = [{ name = "Ran#" }]
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "flet==1.0.*",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "httpx>=0.28",
    # flet's mobile build occasionally drops transitive deps it doesn't see
    # listed directly (flet-dev/flet#5376); httpx needs certifi at runtime.
    "certifi>=2025.6.15",
    # no exact pin: pypi.flet.dev's Android wheels lag PyPI proper
    "pillow>=11.1",
]

[project.scripts]
timtapper = "timtapper.launcher:run"

[project.optional-dependencies]
desktop = ["flet[all]==1.0.*"]

[dependency-groups]
dev = [
    "flet[all]==1.0.*",
    "pytest>=8",
    "pytest-asyncio>=1.1",
    "respx>=0.22",
    "hypothesis>=6.100",
    "pytest-cov>=5",
    "resvg-py>=0.5.0",
    "ruff==0.17.*",
    "playwright>=1.50",
    "blake3>=1.0.11",
]

[tool.flet]
product = "Timtapper"
org = "com.breren"
description = "One Piece TCG match tracker"

[tool.flet.app]
path = "src/timtapper"

# the web build (scripts/build_web.py) is served from <user>.codeberg.page/timtapper/ (GitHub Pages: rebased to /);
# hash routes (#/event/1) so a reload on any screen asks a static host only for index.html
[tool.flet.web]
base_url = "timtapper"
route_url_strategy = "hash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timtapper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src/timtapper"]
markers = [
    "property: hypothesis-driven property-based test",
    "snapshot: compares rendered output against a checked-in baseline",
    "regression: pins a fixed bug; the docstring or a comment says what used to go wrong",
    "live: hits the real optcgapi.com and Limitless TCG (network) — kept out of the default run",
    "desktop: drives the real app window (Windows; takes over the mouse and screen) — kept out of the default run",
    "web: drives a built web app (build/web, build/driven/web) in headless Chrome — kept out of the default run",
    "android: drives the driven APK (build/driven/) on an Android emulator through adb — kept out of the default run",
]
addopts = "-m \"not live and not desktop and not web and not android\""

[tool.coverage.run]
source = ["src/timtapper"]
branch = true

[tool.coverage.report]
fail_under = 100  # `uv run pytest --cov` fails below this; raise it as coverage grows, never lower it

[tool.ruff]
src = ["src", "src/timtapper"]
target-version = "py314"
line-length = 120
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

# flet runs src/timtapper as the app root, so these top-level packages are ours
[tool.ruff.lint.isort]
known-first-party = ["catalog", "core", "db", "events", "i18n", "share", "stats", "backup", "ui", "main", "uitools", "pixels", "locate", "app_driver", "app_window"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

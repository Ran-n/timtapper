# Codeberg (Forgejo Actions): enable Actions in the repository settings for this to run.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: codeberg-tiny
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # Pillow needs the system's fribidi for the raqm text layout the share-card goldens use
      - run: |
          if ! ldconfig -p | grep -q libfribidi; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends libfribidi0
          fi
      - run: bash scripts/ci.sh
